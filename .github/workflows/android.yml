name: Android APK Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies and build web app
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app
          npm run build
          npx cap init "Smart Office" "com.smartoffice.app" --web-dir=dist
          npx cap add android
          npm install --save-dev @capacitor/assets
          mkdir -p assets
          curl -L "https://raw.githubusercontent.com/perves90-crypto/Smart-Office/main/smart-office-logo-1.png" -o assets/icon.png
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Use direct Gradle distribution mirror
        run: |
          echo 'networkTimeout=300000' >> android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's#https\\://services.gradle.org/distributions/#https\\://downloads.gradle.org/distributions/#' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          cat > /tmp/kotlin-fix.gradle <<'EOF'
          allprojects {
            configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
            }
          }
          EOF
          ./gradlew -I /tmp/kotlin-fix.gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Smart-Office-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
