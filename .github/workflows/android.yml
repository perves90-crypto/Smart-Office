name: Android APK Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies and build web app
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app
          npm run build
          npx cap init "Smart Office" "com.smartoffice.app" --web-dir=dist
          npx cap add android
          npm install --save-dev @capacitor/assets
          mkdir -p assets
          curl -L "https://raw.githubusercontent.com/perves90-crypto/Smart-Office/main/smart-office-logo-1.png" -o assets/icon.png
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Add native background motorcycle tracking
        run: |
          mkdir -p android/app/src/main/java/com/smartoffice/app
          cat > android/app/src/main/java/com/smartoffice/app/MainActivity.java <<'EOF'
          package com.smartoffice.app;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(android.os.Bundle savedInstanceState) {
              registerPlugin(BikeTrackingPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
          cat > android/app/src/main/java/com/smartoffice/app/BikeTrackingPlugin.java <<'EOF'
          package com.smartoffice.app;
          import android.content.Intent;
          import android.os.Build;
          import com.getcapacitor.*;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "BikeTracking")
          public class BikeTrackingPlugin extends Plugin {
            @PluginMethod public void startTracking(PluginCall call) {
              Intent i = new Intent(getContext(), BikeLocationService.class);
              i.setAction(BikeLocationService.ACTION_START);
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) getContext().startForegroundService(i); else getContext().startService(i);
              call.resolve();
            }
            @PluginMethod public void stopTracking(PluginCall call) {
              Intent i = new Intent(getContext(), BikeLocationService.class); i.setAction(BikeLocationService.ACTION_STOP);
              getContext().startService(i); call.resolve();
            }
            @PluginMethod public void openLocationSettings(PluginCall call) {
              Intent i=new Intent(android.provider.Settings.ACTION_APPLICATION_DETAILS_SETTINGS,android.net.Uri.parse("package:"+getContext().getPackageName()));
              getContext().startActivity(i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)); call.resolve();
            }
            @PluginMethod public void openBatterySettings(PluginCall call) {
              try { Intent i=new Intent(android.provider.Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,android.net.Uri.parse("package:"+getContext().getPackageName()));getContext().startActivity(i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)); }
              catch(Exception e){Intent i=new Intent(android.provider.Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS);getContext().startActivity(i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));}
              call.resolve();
            }
            @PluginMethod public void saveReportFile(PluginCall call) {
              try {
                String name=call.getString("fileName","Smart-Office-Report.bin");
                String mime=call.getString("mimeType","application/octet-stream");
                String encoded=call.getString("data","");
                byte[] bytes=android.util.Base64.decode(encoded,android.util.Base64.DEFAULT);
                android.net.Uri uri;
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                  android.content.ContentValues values=new android.content.ContentValues();
                  values.put(android.provider.MediaStore.Downloads.DISPLAY_NAME,name);
                  values.put(android.provider.MediaStore.Downloads.MIME_TYPE,mime);
                  values.put(android.provider.MediaStore.Downloads.RELATIVE_PATH,android.os.Environment.DIRECTORY_DOWNLOADS+"/Smart Office");
                  values.put(android.provider.MediaStore.Downloads.IS_PENDING,1);
                  uri=getContext().getContentResolver().insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI,values);
                  if(uri==null)throw new java.io.IOException("Could not create Downloads file");
                  try(java.io.OutputStream stream=getContext().getContentResolver().openOutputStream(uri)){stream.write(bytes);}
                  values.clear();values.put(android.provider.MediaStore.Downloads.IS_PENDING,0);
                  getContext().getContentResolver().update(uri,values,null,null);
                } else {
                  java.io.File dir=new java.io.File(getContext().getExternalFilesDir(android.os.Environment.DIRECTORY_DOWNLOADS),"Smart Office");
                  if(!dir.exists()&&!dir.mkdirs())throw new java.io.IOException("Could not create export folder");
                  java.io.File file=new java.io.File(dir,name);
                  try(java.io.FileOutputStream stream=new java.io.FileOutputStream(file)){stream.write(bytes);}
                  uri=android.net.Uri.fromFile(file);
                }
                JSObject result=new JSObject();result.put("uri",uri.toString());result.put("fileName",name);call.resolve(result);
              } catch(Exception e) { call.reject("Report export failed: "+e.getMessage(),e); }
            }
            @PluginMethod public void saveBikeData(PluginCall call) {
              try {
                String data=call.getString("dataJson","");
                getContext().getSharedPreferences("bike_tracker_data_v2",0).edit().putString("payload",data).apply();
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                  android.content.ContentResolver resolver=getContext().getContentResolver();
                  android.net.Uri collection=android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                  String name="BikeTracker-Backup.json", path=android.os.Environment.DIRECTORY_DOWNLOADS+"/Smart Office/";
                  android.database.Cursor cursor=resolver.query(collection,new String[]{android.provider.MediaStore.Downloads._ID},
                    android.provider.MediaStore.Downloads.DISPLAY_NAME+"=? AND "+android.provider.MediaStore.Downloads.RELATIVE_PATH+"=?",
                    new String[]{name,path},null);
                  android.net.Uri fileUri=null;
                  if(cursor!=null){try{if(cursor.moveToFirst())fileUri=android.content.ContentUris.withAppendedId(collection,cursor.getLong(0));}finally{cursor.close();}}
                  if(fileUri==null){android.content.ContentValues values=new android.content.ContentValues();values.put(android.provider.MediaStore.Downloads.DISPLAY_NAME,name);values.put(android.provider.MediaStore.Downloads.MIME_TYPE,"application/json");values.put(android.provider.MediaStore.Downloads.RELATIVE_PATH,path);fileUri=resolver.insert(collection,values);}
                  if(fileUri==null)throw new java.io.IOException("Cannot create shared backup file");
                  try(java.io.OutputStream stream=resolver.openOutputStream(fileUri,"wt")){if(stream==null)throw new java.io.IOException("Cannot write shared backup file");stream.write(data.getBytes(java.nio.charset.StandardCharsets.UTF_8));}
                } else {
                  java.io.File dir=new java.io.File(android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS),"Smart Office");
                  if(!dir.exists())dir.mkdirs();
                  try(java.io.FileOutputStream stream=new java.io.FileOutputStream(new java.io.File(dir,"BikeTracker-Backup.json"))){stream.write(data.getBytes(java.nio.charset.StandardCharsets.UTF_8));}
                }
                call.resolve();
              } catch(Exception e) { call.reject("Bike data backup failed: "+e.getMessage(),e); }
            }
            @PluginMethod public void getBikeData(PluginCall call) {
              String data=getContext().getSharedPreferences("bike_tracker_data_v2",0).getString("payload","null");
              if("null".equals(data) && Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                android.database.Cursor cursor=null;
                try {
                  cursor=getContext().getContentResolver().query(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                    new String[]{android.provider.MediaStore.Downloads._ID},
                    android.provider.MediaStore.Downloads.DISPLAY_NAME+"=? AND "+android.provider.MediaStore.Downloads.RELATIVE_PATH+"=?",
                    new String[]{"BikeTracker-Backup.json",android.os.Environment.DIRECTORY_DOWNLOADS+"/Smart Office/"},null);
                  if(cursor!=null && cursor.moveToFirst()) {
                    android.net.Uri uri=android.content.ContentUris.withAppendedId(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI,cursor.getLong(0));
                    try(java.io.InputStream in=getContext().getContentResolver().openInputStream(uri);java.io.ByteArrayOutputStream outBytes=new java.io.ByteArrayOutputStream()){
                      if(in!=null){byte[] buffer=new byte[8192];int n;while((n=in.read(buffer))!=-1)outBytes.write(buffer,0,n);data=outBytes.toString("UTF-8");}
                    }
                  }
                } catch(Exception ignored){} finally {if(cursor!=null)cursor.close();}
                if(!"null".equals(data))getContext().getSharedPreferences("bike_tracker_data_v2",0).edit().putString("payload",data).apply();
              }
              JSObject out=new JSObject();out.put("dataJson",data);call.resolve(out);
            }
            @PluginMethod public void getTrackData(PluginCall call) {
              android.content.SharedPreferences p=getContext().getSharedPreferences("bike_native_track",0);
              JSObject out=new JSObject();
              out.put("pointsJson",p.getString("points","[]"));
              out.put("distanceM",p.getFloat("distanceM",0));
              out.put("maxSpeed",p.getFloat("maxSpeed",0));
              out.put("startedAt",p.getLong("startedAt",0));
              out.put("tracking",p.getBoolean("tracking",false));
              call.resolve(out);
            }
          }
          EOF
          cat > android/app/src/main/java/com/smartoffice/app/BikeLocationService.java <<'EOF'
          package com.smartoffice.app;
          import android.app.*;
          import android.content.*;
          import android.location.*;
          import android.os.*;
          import org.json.*;
          public class BikeLocationService extends Service {
            public static final String ACTION_START="com.smartoffice.app.BIKE_START", ACTION_STOP="com.smartoffice.app.BIKE_STOP";
            private LocationManager manager; private LocationListener listener;
            private static final String PREF="bike_native_track", CHANNEL="bike_tracking_channel";
            @Override public void onCreate(){super.onCreate();manager=(LocationManager)getSystemService(LOCATION_SERVICE);}
            private void notification(){
              if(Build.VERSION.SDK_INT>=26){NotificationChannel ch=new NotificationChannel(CHANNEL,"Motorcycle ride tracking",NotificationManager.IMPORTANCE_LOW);((NotificationManager)getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch);}
              Notification.Builder b=Build.VERSION.SDK_INT>=26?new Notification.Builder(this,CHANNEL):new Notification.Builder(this);
              b.setContentTitle("Smart Office Bike Tracker").setContentText("GPS ride tracking is active").setSmallIcon(android.R.drawable.ic_menu_mylocation).setOngoing(true);
              startForeground(7101,b.build());
            }
            @Override public int onStartCommand(Intent intent,int flags,int startId){
              String action=intent==null?ACTION_START:intent.getAction();
              if(ACTION_STOP.equals(action)){stopTracking();stopForeground(true);stopSelf();return START_NOT_STICKY;}
              notification();
              if(intent!=null && ACTION_START.equals(action))getSharedPreferences(PREF,0).edit().putString("points","[]").putFloat("distanceM",0).putFloat("maxSpeed",0).putLong("startedAt",System.currentTimeMillis()).putBoolean("tracking",true).apply();
              startGps(); return START_STICKY;
            }
            private void startGps(){
              listener=new LocationListener(){public void onLocationChanged(Location l){savePoint(l);} public void onProviderEnabled(String p){} public void onProviderDisabled(String p){} public void onStatusChanged(String p,int s,Bundle e){}};
              try{if(checkSelfPermission(android.Manifest.permission.ACCESS_FINE_LOCATION)==android.content.pm.PackageManager.PERMISSION_GRANTED)manager.requestLocationUpdates(LocationManager.GPS_PROVIDER,1000,2,listener);}catch(Exception ignored){}
            }
            private void savePoint(Location l){
              android.content.SharedPreferences p=getSharedPreferences(PREF,0);try{
                JSONArray a=new JSONArray(p.getString("points","[]"));
                JSONObject point=new JSONObject();point.put("lat",l.getLatitude());point.put("lng",l.getLongitude());point.put("at",l.getTime());point.put("speed",l.hasSpeed()?l.getSpeed()*3.6:0);point.put("accuracy",l.hasAccuracy()?l.getAccuracy():999);
                double distance=p.getFloat("distanceM",0);
                if(a.length()>0){JSONObject prev=a.getJSONObject(a.length()-1);float[] result=new float[1];Location.distanceBetween(prev.getDouble("lat"),prev.getDouble("lng"),l.getLatitude(),l.getLongitude(),result);if(result[0]>=3&&result[0]<200&&l.getAccuracy()<=50)distance+=result[0];}
                if(l.getAccuracy()<=50)a.put(point);
                p.edit().putString("points",a.toString()).putFloat("distanceM",(float)distance).putFloat("maxSpeed",Math.max(p.getFloat("maxSpeed",0),l.hasSpeed()?l.getSpeed()*3.6f:0)).apply();
              }catch(Exception ignored){}
            }
            private void stopTracking(){try{if(manager!=null&&listener!=null)manager.removeUpdates(listener);}catch(Exception ignored){}getSharedPreferences(PREF,0).edit().putBoolean("tracking",false).apply();}
            @Override public void onDestroy(){stopTracking();super.onDestroy();}
            @Override public android.os.IBinder onBind(Intent i){return null;}
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          perms='''    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          '''
          if 'ACCESS_BACKGROUND_LOCATION' not in s: s=s.replace('<application',perms+'    <application',1)
          service='''        <service android:name=".BikeLocationService" android:enabled="true" android:exported="false" android:foregroundServiceType="location" />\n    '''
          if 'BikeLocationService' not in s: s=s.replace('</application>',service+'</application>')
          p.write_text(s)
          PY
      - name: Download Gradle from independent mirror
        run: |
          set -e
          mkdir -p "$HOME/gradle-dist"
          cd "$HOME/gradle-dist"
          for url in \
            "https://mirrors.huaweicloud.com/gradle/gradle-8.11.1-all.zip" \
            "https://repo.huaweicloud.com/gradle/gradle-8.11.1-all.zip"; do
            echo "Trying Gradle mirror: $url"
            if curl -fL --connect-timeout 30 --max-time 600 --retry 2 --retry-delay 5 "$url" -o gradle-8.11.1-all.zip; then
              break
            fi
            rm -f gradle-8.11.1-all.zip
          done
          test -s gradle-8.11.1-all.zip
          unzip -q gradle-8.11.1-all.zip
          "$HOME/gradle-dist/gradle-8.11.1/bin/gradle" --version
      - name: Configure permanent release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/smart-office-release.jks
          echo "Checking decoded keystore file..."
          ls -l android/app/smart-office-release.jks
          echo "Validating keystore password (diagnostic output contains no password)..."
          set +e
          keytool -list -keystore android/app/smart-office-release.jks -storepass:env ANDROID_KEYSTORE_PASSWORD 2>&1
          KEYTOOL_STATUS=$?
          set -e
          if [ "$KEYTOOL_STATUS" -ne 0 ]; then
            echo "::error::Keystore password or decoded keystore file is invalid. Check ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets."
            exit 1
          fi
          echo "Checking key alias..."
          keytool -list -keystore android/app/smart-office-release.jks -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if "signingConfigs" not in s:
              pos = s.find("    buildTypes {")
              if pos < 0:
                  raise SystemExit("Could not locate Android buildTypes block")
              signing = """    signingConfigs {
                  release {
                      storeFile file("smart-office-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }

          """
              s = s[:pos] + signing + s[pos:]
          bt = s.find("buildTypes {")
          if bt < 0:
              raise SystemExit("Could not locate buildTypes block")
          match = re.search(r"(?m)^\s*release\s*\{", s[bt:])
          if not match:
              raise SystemExit("Could not locate release buildType")
          start = bt + match.start()
          brace = s.find("{", start)
          depth = 0
          end = None
          for j in range(brace, len(s)):
              if s[j] == "{":
                  depth += 1
              elif s[j] == "}":
                  depth -= 1
                  if depth == 0:
                      end = j
                      break
          if end is None:
              raise SystemExit("Unbalanced release buildType braces")
          block = s[brace:end]
          if "signingConfig" not in block:
              s = s[:end] + "\n            signingConfig signingConfigs.release\n        " + s[end:]
          p.write_text(s)
          PY
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          cat > /tmp/kotlin-fix.gradle <<'EOF'
          allprojects {
            configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
            }
          }
          EOF
          "$HOME/gradle-dist/gradle-8.11.1/bin/gradle" --no-daemon -I /tmp/kotlin-fix.gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Smart-Office-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

